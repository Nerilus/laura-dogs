name: CI/CD Pipeline - Déploiement Production VPS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nerilus/laura-dogs

jobs:
  # ============================================================================
  # 1. Vérification de la qualité du code (Linting & TypeScript Build)
  # ============================================================================
  check:
    name: Lint & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Exécuter le linter (oxlint)
        run: npm run lint

      - name: Vérifier la compilation Vite (Typecheck & Build)
        run: npm run build

  # ============================================================================
  # 2. Construction et publication de l'image Docker sur GitHub Packages (GHCR)
  # ============================================================================
  build-and-push:
    name: Build & Push Docker Image
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion au registre GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Déterminer les tags et labels Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Compiler et publier l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 3. Déploiement automatique sur le VPS via SSH & Docker Compose
  # ============================================================================
  deploy:
    name: Deploy to VPS
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code source pour docker-compose
        uses: actions/checkout@v4

      - name: Déployer sur le VPS via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_KEY" ]; then
            echo "❌ ERREUR : Les secrets GitHub VPS_HOST, VPS_USERNAME et/ou VPS_SSH_KEY ne sont pas configurés."
            echo "Veuillez les ajouter dans Settings > Secrets and variables > Actions."
            exit 1
          fi

          PORT="${VPS_PORT:-22}"
          TARGET_DIR="${VPS_PATH:-/opt/lauradogs}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$VPS_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p $PORT $VPS_USER@$VPS_HOST"
          SCP_CMD="scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -P $PORT"

          echo "📁 Préparation du dossier $TARGET_DIR sur le VPS..."
          $SSH_CMD "mkdir -p $TARGET_DIR"

          echo "📄 Transfert de docker-compose.yml..."
          $SCP_CMD docker-compose.yml "$VPS_USER@$VPS_HOST:$TARGET_DIR/docker-compose.yml"

          echo "🚀 Mise à jour et redémarrage du conteneur sur le VPS..."
          $SSH_CMD "
            cd '$TARGET_DIR'
            echo '$GH_TOKEN' | docker login ghcr.io -u '$GH_ACTOR' --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            docker compose ps
          "

          echo "✅ Déploiement terminé avec succès !"
