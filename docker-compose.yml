services:
  lauradogs:
    image: ${DOCKER_IMAGE:-ghcr.io/nerilus/laura-dogs:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lauradogs-web
    restart: unless-stopped
    ports:
      # Expose sur le port configuré (défaut: 8080) sur la machine hôte
      # Connectez votre Reverse Proxy (Nginx, Traefik, NPM) vers 127.0.0.1:8080
      - "127.0.0.1:${APP_PORT:-8080}:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
