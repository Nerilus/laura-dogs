# ==============================================================================
# Exemple de configuration Nginx Reverse Proxy pour votre VPS
# Emplacement habituel sur le VPS : /etc/nginx/sites-available/lauradogs.conf
# Puis lien symbolique : ln -s /etc/nginx/sites-available/lauradogs.conf /etc/nginx/sites-enabled/
# ==============================================================================

# Redirection automatique HTTP vers HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name votre-domaine.fr www.votre-domaine.fr;

    # Défi Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Serveur HTTPS sécurisé
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name votre-domaine.fr www.votre-domaine.fr;

    # Chemins vers vos certificats SSL (générés par Certbot / Let's Encrypt)
    # sudo certbot --nginx -d votre-domaine.fr -d www.votre-domaine.fr
    ssl_certificate /etc/letsencrypt/live/votre-domaine.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/votre-domaine.fr/privkey.pem;

    # Paramètres SSL recommandés
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Optimisations
    client_max_body_size 10M;

    location / {
        # Redirection vers le conteneur Docker Laura' Dogs (port 8080 configuré dans docker-compose)
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
